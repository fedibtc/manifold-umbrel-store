manifestVersion: 1
id: fedi-dev-flip
name: Liquidity Provider (staging)
category: bitcoin
version: "0.1.3-master.2e6485b0"
tagline: Provide Fedimint federation liquidity on the Manifold staging environment
description: >-
  FLIP (Federation Liquidity Provisioner) offers liquidity to Fedimint
  federations: it advertises capacity and credentials to Federation
  Initiators and allocates funds from its bundled Lightning gateway. This staging test build
  targets the Manifold staging environment
  (Mutinynet/Signet) — test money only. The bundled gatewayd sidecar is
  LDK-internal and needs no Bitcoin or Lightning app on the device.

  The dashboard asks for an access token: it is this app's password, shown
  by Umbrel when you open the app (also under the app's ⋯ → Show details).
