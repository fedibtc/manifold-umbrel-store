releaseNotes: >-
  Images now pull directly from the public ghcr.io/fedibtc packages: remove the old fedi-dev-registry proxy container and re-add this store by its plain URL. IMPORTANT: this update (master 2e6485b0) changes FLIP's database migrations, so an updated app crash-loops on existing data. Uninstall and reinstall instead — this wipes the app's data including the provider identity — then redo the setup wizard.
