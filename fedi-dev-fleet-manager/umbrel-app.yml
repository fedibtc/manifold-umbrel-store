releaseNotes: >-
  Update Fleet Manager only to Manifold bb63efca (Fedimint 0.12).
  Includes explicit child API/UI authentication and the stability-pool compatibility port.
  Fresh formation, child recovery, backup restore, and paid formation were tested on 0.12;
  upgrading existing 0.11 data has not been qualified. Back up data before updating.
  Staging only; test funds and disposable data.
