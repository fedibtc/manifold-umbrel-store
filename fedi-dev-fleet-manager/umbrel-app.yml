releaseNotes: >-
  Update staging Fleet Manager to Manifold c5123c0ff265e147775bf1240b5e436b401fdff0
  (MG 0.1.9) with Fedimint v0.12.0-fedi18. Adds guardian transfer, which is on
  by default in staging.
  Database migrations keep existing data, but the previous build cannot
  open the migrated database, so there is no downgrade.
  Back up the complete stopped data directory before updating.
  Existing 0.11 guardian upgrades and packaged-device upgrades have not been qualified.
  Staging only; test funds.
