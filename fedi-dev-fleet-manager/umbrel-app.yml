releaseNotes: >-
  Update staging Fleet Manager to Manifold c9ff465fc645d25a448734c4851ed41bb74a99e8
  (MG 0.1.9) with Fedimint v0.12.0-fedi18. Before handing a guardian to a new
  host in a guardian transfer, the old host now checks the new host's PeerBadge,
  and a restore from the recovery words keeps a stopped transfer copy down.
  No database changes since the previous staging build.
  Back up the complete stopped data directory before updating.
  Existing 0.11 guardian upgrades and packaged-device upgrades have not been qualified.
  Staging only; test funds.
