releaseNotes: >-
  Update staging Fleet Manager to Manifold e14e0f9baf25c8942721e9b620a6f1aa95f25415
  with Fedimint v0.12.0-fedi11. Adds the Support page, a private chat with
  Fedi support over Nostr, and the latest operator dashboard and guardian fixes.
  Database migrations only add tables, so existing data is kept.
  Back up the complete stopped data directory before updating.
  Existing 0.11 guardian upgrades and packaged-device upgrades have not been qualified.
  Staging only; test funds.
