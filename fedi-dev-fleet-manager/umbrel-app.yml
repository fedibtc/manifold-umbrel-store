id: fedi-dev-fleet-manager
name: Fleet Manager (staging)
category: bitcoin
version: "0.1.3-master.0bfc7a32"
tagline: Run a Fedimint guardian seat on the Manifold staging environment
description: >-
  Fleet Manager coordinates Fedimint guardian seat formation and supervises
  bundled fedimintd children. This internal dev build targets the Manifold
  staging environment (Mutinynet/Signet via the built-in Esplora backend), so
  it does not depend on Umbrel's Bitcoin Core app. The operator dashboard is
  served through Umbrel's authenticated app proxy.
