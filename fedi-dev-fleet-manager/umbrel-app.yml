releaseNotes: >-
  Images now pull directly from the public ghcr.io/fedibtc packages: remove the old fedi-dev-registry proxy container and re-add this store by its plain URL. IMPORTANT: this update (master d090989b) changes the daemon's database migrations, so an updated app crash-loops on existing data. Uninstall and reinstall instead — this wipes the app's data (guardian identities and seats) — then redo onboarding and the trust-material steps.