releaseNotes: >-
  Adds Esplora fallback for pruned Bitcoin Core, authorization renewal after setup,
  and payout fixes. Back up before updating; existing data is retained.
  Manifold image commit d87b6dd2d984b3f15bc214718debfcc9648654d8.
  Upgrade and restart tested on Umbrel with existing data and pruned Core.
