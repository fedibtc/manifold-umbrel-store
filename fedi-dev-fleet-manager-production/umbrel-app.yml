manifestVersion: 1
id: fedi-dev-fleet-manager-production
name: Fleet Manager
category: bitcoin
version: "0.1.3"
tagline: Run Fedimint guardians on Bitcoin mainnet
description: >-
  Fleet Manager runs Fedimint guardians on the Manifold production environment.
  Requires the local Bitcoin Core app on mainnet. The dashboard uses Umbrel login.
  Production and staging have separate identities and data. Updates preserve
  production data; do not uninstall to update. Telemetry registers automatically
  after authorization and receipt of the signed setup-payment policy.
developer: Fedi
website: https://fedi.xyz
dependencies: [bitcoin]
repo: https://github.com/fedibtc/manifold-umbrel-store
support: https://github.com/fedibtc/manifold-umbrel-store/issues
port: 8482
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Fedi
submission: https://github.com/fedibtc/manifold-umbrel-store
releaseNotes: >-
  Update Fleet Manager to Manifold d32c0ef4b0a3b7881f0c98f6cf944a7a349c650d
  with Fedimint v0.12.0-fedi7, matching the FMan image pinned by the
  Start9 Community Manifold Fedimint Guardian 0.1.0:0 release.
  Back up the complete stopped data directory before updating.
  Existing 0.11 guardian upgrades and packaged-device upgrades have not been qualified.
  Preserve existing data; do not uninstall, reset, or re-onboard to update.
  Production rollout requires upgrade qualification with existing guardian and wallet data.
